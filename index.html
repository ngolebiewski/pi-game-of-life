<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nick Golebiewski × Game of Life</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    if (!WebAssembly.instantiateStreaming) {
      // Safari polyfill
      WebAssembly.instantiateStreaming = async (resp, importObject) => {
        const source = await (await resp).arrayBuffer();
        return await WebAssembly.instantiate(source, importObject);
      };
    }

    WebAssembly.instantiateStreaming(fetch("pi-game-of-life.wasm"), go.importObject)
      .then(result => go.run(result.instance))
      .catch(err => {
        document.body.innerHTML = "<pre style='color:white'>" + err + "</pre>";
        console.error(err);
      });
  </script>
</body>
</html>
